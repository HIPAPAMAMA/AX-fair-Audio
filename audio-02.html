<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fb">
  <title>도슨트 AI 전현매 기자</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: rgba(255,255,255,.90);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0cb7fe;
      --shadow: 0 18px 50px rgba(15,23,42,.10);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Noto Sans KR", "Pretendard", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(12,183,254,.11), transparent 36%),
        var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
    }
    .wrap { width: min(100%, 560px); }
    .logo {
      display: block;
      width: min(88%, 430px);
      height: auto;
      margin: 0 auto 30px;
    }
    .title {
      text-align: center;
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1.28;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0 0 34px;
      word-break: keep-all;
    }
    .player {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 32px;
      padding: 34px 24px 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .play-btn {
      width: 176px;
      height: 176px;
      border: 0;
      border-radius: 50%;
      margin: 0 auto;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #08265c 0%, #071936 100%);
      box-shadow: 0 20px 40px rgba(7,29,69,.22), inset 0 0 0 1px rgba(255,255,255,.08);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease;
    }
    .play-btn:active { transform: scale(.97); }
    .play-icon {
      width: 0; height: 0;
      border-top: 28px solid transparent;
      border-bottom: 28px solid transparent;
      border-left: 42px solid white;
      margin-left: 10px;
    }
    .pause-icon { display: none; gap: 14px; }
    .pause-icon span {
      display: block; width: 15px; height: 58px;
      border-radius: 5px; background: white;
    }
    .is-playing .play-icon { display: none; }
    .is-playing .pause-icon { display: flex; }
    .status {
      text-align: center;
      font-size: 28px;
      line-height: 1.3;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 28px 0;
    }
    .progress {
      width: 100%;
      height: 16px;
      border-radius: 999px;
      background: #e3eaf2;
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #0cb7fe, #2189ff);
    }
    .times {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 18px;
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .hint {
      margin-top: 26px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      word-break: keep-all;
    }
    audio { display: none; }
    @media (max-width: 390px) {
      body { padding-left: 14px; padding-right: 14px; }
      .player { padding-left: 20px; padding-right: 20px; border-radius: 28px; }
      .play-btn { width: 160px; height: 160px; }
      .status { font-size: 26px; }
    }
  </style>
</head>

    <h1 class="title">도슨트 AI 전현매 기자</h1>

    <section class="player" aria-label="오디오 재생">
      <button class="play-btn" id="playBtn" type="button" aria-label="재생">
        <span class="play-icon" aria-hidden="true"></span>
        <span class="pause-icon" aria-hidden="true"><span></span><span></span></span>
      </button>

      <div class="status" id="status">재생하기</div>

      <div class="progress" id="progress" role="slider" aria-label="재생 위치"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="times">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <div class="hint">재생 버튼을 누르면 음성이 시작됩니다.</div>

      <audio id="audio" preload="metadata" playsinline>
        <source src="audio-02.mp3" type="audio/mpeg">
      </audio>
    </section>
  </main>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');
    const currentTime = document.getElementById('currentTime');
    const duration = document.getElementById('duration');

    const formatTime = (seconds) => {
      if (!Number.isFinite(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    };

    const syncUI = () => {
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      progressFill.style.width = `${pct}%`;
      progress.setAttribute('aria-valuenow', String(Math.round(pct)));
      currentTime.textContent = formatTime(audio.currentTime);
      duration.textContent = formatTime(audio.duration);
    };

    playBtn.addEventListener('click', async () => {
      try {
        if (audio.ended) audio.currentTime = 0;
        if (audio.paused) await audio.play();
        else audio.pause();
      } catch (e) {
        status.textContent = '재생할 수 없음';
      }
    });

    audio.addEventListener('play', () => {
      playBtn.classList.add('is-playing');
      playBtn.setAttribute('aria-label', '일시정지');
      status.textContent = '재생 중';
    });

    audio.addEventListener('pause', () => {
      playBtn.classList.remove('is-playing');
      playBtn.setAttribute('aria-label', '재생');
      if (!audio.ended) status.textContent = '일시정지';
    });

    audio.addEventListener('ended', () => {
      playBtn.classList.remove('is-playing');
      playBtn.setAttribute('aria-label', '다시 재생');
      status.textContent = '다시 듣기';
      syncUI();
    });

    audio.addEventListener('loadedmetadata', syncUI);
    audio.addEventListener('durationchange', syncUI);
    audio.addEventListener('timeupdate', syncUI);

    audio.addEventListener('error', () => {
      status.textContent = '재생할 수 없음';
      document.querySelector('.hint').textContent = '음원을 불러오지 못했습니다.';
    });

    const seek = (clientX) => {
      if (!audio.duration) return;
      const rect = progress.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      audio.currentTime = ratio * audio.duration;
      syncUI();
    };

    progress.addEventListener('click', (e) => seek(e.clientX));
    progress.addEventListener('pointerdown', (e) => {
      progress.setPointerCapture(e.pointerId);
      seek(e.clientX);
    });
    progress.addEventListener('pointermove', (e) => {
      if (progress.hasPointerCapture(e.pointerId)) seek(e.clientX);
    });

    window.addEventListener('load', async () => {
      try { await audio.play(); } catch (e) {}
    });
  </script>
</body>
</html>
